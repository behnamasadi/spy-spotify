name: Build Spytify (.NET Framework)

on:
  push:
    branches: [ main, master ]
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 4.6.1 Developer Pack
        run: |
          choco install netfx-4.6.1-devpack -y

      - name: Restore NuGet packages
        run: nuget restore EspionSpotify.sln

      - name: Build solution (Release)
        run: msbuild EspionSpotify.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spytify-win-net461
          path: |
            **/bin/Release/**
